syntax = "proto3";

package homework.v1;

service ItemService {
  rpc GetItem (GetItemRequest) returns (Item);
  rpc ListItems (ListItemsRequest) returns (stream Item);
  rpc CreateItems (stream Item) returns (CreateItemsSummary);
  rpc ProcessItems (stream Item) returns (stream Item);
}

message Item {
  string id = 1;
  string name = 2;
  double price = 3;
}

message GetItemRequest {
  string id = 1;
}

message ListItemsRequest {
  uint32 limit = 1;
}

message CreateItemsSummary {
  uint32 created_count = 1;
}